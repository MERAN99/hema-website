# Builds the site and uploads it to the hemacompany.com server over SSH on every push to main.
# One secret is needed (Settings > Secrets and variables > Actions):
#   DEPLOY_SSH_KEY  private key whose public half is in /home/hema/.ssh/authorized_keys on the server
name: Deploy to hemacompany.com

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two uploads at the same time; a newer push waits for the running one.
# The job only needs to read the code; uploads use the SSH key, not the GitHub token.
permissions:
  contents: read

concurrency:
  group: deploy-hemacompany
  cancel-in-progress: false

env:
  SERVER: 159.198.47.60
  SSH_USER: hema
  # The server's own SSH host key, pinned so the upload can't be redirected to another machine.
  HOST_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICjSOmvhCz/7vuKBHx4AKJx2SjzUM8mxF1S8NbcDAxLi"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Check the build includes .htaccess
        run: test -f dist/.htaccess

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$SERVER $HOST_KEY" > ~/.ssh/known_hosts

      - name: Upload to server
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          tar -C dist -czf site.tgz .
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes site.tgz "$SSH_USER@$SERVER:site.tgz"
          # Unpack next to the site, then swap each top-level item in. Files not in the build
          # (e.g. .well-known used for SSL renewals) are left untouched.
          $SSH "$SSH_USER@$SERVER" 'set -e
            rm -rf ~/site-new && mkdir ~/site-new
            tar -xzf ~/site.tgz -C ~/site-new
            cd ~/public_html
            for f in $(ls -A ~/site-new); do
              rm -rf "$f.old"
              if [ -e "$f" ]; then mv "$f" "$f.old"; fi
              mv ~/site-new/"$f" "$f"
              rm -rf "$f.old"
            done
            rm -rf ~/site-new ~/site.tgz
            echo "Deployed: $(ls ~/public_html/assets | tr "\n" " ")"'
