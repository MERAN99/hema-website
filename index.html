    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=Noto+Kufi+Arabic:wght@500;600;700;800&family=Vazirmatn:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=Noto+Kufi+Arabic:wght@500;600;700;800&family=Vazirmatn:wght@400;500;600;700&display=swap" /></noscript>
    <!-- The scroll film opens the page: its first frame (small set on phones) loads immediately and doubles as the poster. -->
    <link rel="preload" as="image" type="image/webp" href="./film/desktop/f_0001.webp?v=3" fetchpriority="high" />
    <meta property="og:type" content="website" />

    <meta property="og:image:height" content="630" />

    <meta name="twitter:image" content="https://hemacompany.com/og-image.jpg" />
    <title>Hema Company | General Contracting, Roads &amp; Infrastructure</title>
    <!-- Loading screen: shown on the very first paint (no JavaScript needed). The film fills the bar as the first
         half of the film loads in full quality and hides the screen when it is done (or after 15 s at most); the
         CSS animation below fades it out at 16 s regardless. The rest of the film keeps loading in the background. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #0a1f47;
        transition: opacity 0.4s ease, visibility 0.4s;
        animation: boot-out 0.4s ease 16s forwards;
      }
      #boot.done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot .mark {
        display: grid;
        place-items: center;
        gap: 22px;
      }
      #boot img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #fff;
        padding: 8px;
      }
      #boot .lane {
        position: relative;
        width: 160px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: rgba(169, 203, 245, 0.18);
      }
      #boot .lane::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 200%;
        background: repeating-linear-gradient(90deg, #a9cbf5 0 14px, transparent 14px 26px);
        animation: boot-lane 0.9s linear infinite;
      }
      #boot .fill {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: #a9cbf5;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.25s ease-out;
      }
      #boot .pct {
        min-height: 1em;
        font: 600 12px/1 system-ui, -apple-system, 'Segoe UI', sans-serif;
        letter-spacing: 0.08em;
        color: #a9cbf5;
        font-variant-numeric: tabular-nums;
      }
      #boot .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      @keyframes boot-lane {
        to {
          transform: translateX(-26px);
        }
      }
      @keyframes boot-out {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .lane::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status">
      <div class="mark">
        <img src="./images/logo-mark.webp" width="64" height="64" alt="" />
        <span class="lane"><span class="fill"></span></span>
        <span class="pct" aria-hidden="true"></span>
      </div>
      <span class="sr">Loading · بارکردن · جارٍ التحميل</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
