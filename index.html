<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f2a5c" />
    <meta name="description" content="Hema Company for General Contracting Ltd. builds roads, buildings, water networks and bridges across the Kurdistan Region and Iraq since 2004." />
    <link rel="canonical" href="https://hemacompany.com/" />
    <link rel="icon" type="image/png" href="./images/logo-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint; text shows in a system font until they arrive (display=swap). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=Noto+Kufi+Arabic:wght@500;600;700;800&family=Vazirmatn:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=Noto+Kufi+Arabic:wght@500;600;700;800&family=Vazirmatn:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=Noto+Kufi+Arabic:wght@500;600;700;800&family=Vazirmatn:wght@400;500;600;700&display=swap" /></noscript>
    <!-- The scroll film opens the page: its first frame (small set on phones) loads immediately and doubles as the poster. -->
    <link rel="preload" as="image" type="image/webp" href="./film/desktop/f_0001.webp" fetchpriority="high" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hema Company" />
    <meta property="og:title" content="Hema Company | General Contracting, Roads &amp; Infrastructure" />
    <meta property="og:description" content="Grade 1 general contractor building roads, buildings, water networks and bridges across the Kurdistan Region and Iraq since 2004." />
    <meta property="og:url" content="https://hemacompany.com/" />
    <meta property="og:image" content="https://hemacompany.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hema Company | General Contracting, Roads &amp; Infrastructure" />
    <meta name="twitter:description" content="Grade 1 general contractor building roads, buildings, water networks and bridges across the Kurdistan Region and Iraq since 2004." />
    <meta name="twitter:image" content="https://hemacompany.com/og-image.jpg" />
    <title>Hema Company | General Contracting, Roads &amp; Infrastructure</title>
    <!-- Loading screen: shown on the very first paint (no JavaScript needed). The film hides it as soon as its
         opening frames are ready; the CSS animation below fades it out by 2.5 s regardless, so nobody waits longer.
         The rest of the film keeps loading in the background. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #0a1f47;
        transition: opacity 0.4s ease, visibility 0.4s;
        animation: boot-out 0.4s ease 2.1s forwards;
      }
      #boot.done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot .mark {
        display: grid;
        place-items: center;
        gap: 22px;
      }
      #boot img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #fff;
        padding: 8px;
      }
      #boot .lane {
        position: relative;
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: rgba(169, 203, 245, 0.18);
      }
      #boot .lane::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 200%;
        background: repeating-linear-gradient(90deg, #a9cbf5 0 14px, transparent 14px 26px);
        animation: boot-lane 0.9s linear infinite;
      }
      #boot .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      @keyframes boot-lane {
        to {
          transform: translateX(-26px);
        }
      }
      @keyframes boot-out {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .lane::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status">
      <div class="mark">
        <img src="./images/logo-mark.webp" width="64" height="64" alt="" />
        <span class="lane"></span>
      </div>
      <span class="sr">Loading · بارکردن · جارٍ التحميل</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
